<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SDCP Social</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sdcp-blue: #1e396d;
        }

        body {
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--sdcp-blue);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .login-header p {
            color: #666;
            margin-top: 8px;
        }

        .btn-primary {
            background-color: var(--sdcp-blue);
            border-color: var(--sdcp-blue);
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #2a4a8a;
            border-color: #2a4a8a;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>SDCP SOCIAL</h1>
            <p>Social Media Dashboard</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login">
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
    </div>
</body>
</html>
